<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2F3;--panel:#FFFFFF;--soft:#F6F6F7;--line:#E8E8EA;--ink:#1C1C1E;--ink2:#48484D;--muted:#8E8E93;
  --red:#F0443A;--grey-fill:#F4F4F5;--grey-line:#D6D6DA;--grey-ink:#6B6B70;
  --shadow:0 1px 2px rgba(0,0,0,.04);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --hour:64px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0F11;--panel:#1A1A1D;--soft:#222226;--line:#2C2C31;--ink:#F2F2F4;--ink2:#C7C7CC;--muted:#8E8E93;
  --grey-fill:#232327;--grey-line:#3A3A40;--grey-ink:#A1A1A6;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0F11;--panel:#1A1A1D;--soft:#222226;--line:#2C2C31;--ink:#F2F2F4;--ink2:#C7C7CC;--muted:#8E8E93;
  --grey-fill:#232327;--grey-line:#3A3A40;--grey-ink:#A1A1A6;--shadow:none;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.shell{height:100%;display:flex;flex-direction:column;padding:10px 14px 14px}
/* top bar */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:4px 6px 12px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--ink);display:grid;place-items:center}
.logo i{width:10px;height:10px;border-radius:3px;background:var(--panel)}
.pillnav{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.pillnav button{border:0;background:none;border-radius:999px;padding:6px 14px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:7px}
.pillnav button.on{background:var(--soft);color:var(--ink)}
.pillnav svg{width:15px;height:15px}
.acts{justify-self:end;display:flex;gap:6px}
.round{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--ink2)}
.round svg{width:15px;height:15px}
#main{flex:1;min-height:0}
/* plan layout */
.plan{display:grid;grid-template-columns:320px minmax(420px,1fr) 380px;gap:12px;height:100%}
.plan.wk{grid-template-columns:300px 1fr}
.plan.wk .vis{display:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 16px 10px}
.phead h2{margin:0;font-size:15px;font-weight:600}
.ib{border:0;background:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink2)}
.ib:hover{background:var(--soft)}
.ib svg{width:16px;height:16px}
.scroll{flex:1;overflow:auto;min-height:0}
/* tasks */
.tasks .scroll{padding:0 10px 16px}
.status{font-size:12px;color:var(--muted);padding:0 16px 8px;margin-top:-6px}
.status.err{color:var(--red)}
.grp{margin-bottom:6px}
.gh{display:flex;align-items:center;gap:10px;padding:8px 6px;font-weight:500;color:var(--ink)}
.gi{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--h);background:color-mix(in srgb,var(--h) 15%,var(--panel));flex:none}
.gh{width:100%;border:0;background:none;text-align:left;border-radius:10px;cursor:pointer}
.gh:hover{background:var(--soft)}
.gh .gn{flex:1;font-weight:600}
.gh .gc{font-size:12px;color:var(--muted);font-weight:500}
.gh .gcar{width:14px;color:var(--muted);font-size:11px}
.sg{margin:2px 0 4px 14px;border-left:2px solid color-mix(in srgb,var(--h) 25%,var(--panel));padding-left:8px}
.sgh{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--h);padding:6px 6px 2px;letter-spacing:.01em}
.sgh i{width:6px;height:6px;border-radius:50%;background:var(--h)}
.sgh span{margin-left:auto;color:var(--muted);font-weight:500}
.addrow.more{font-size:12.5px;padding:4px 6px;color:var(--muted)}
.sub .gh{padding-left:22px}
.sub .gi{width:22px;height:22px;border-radius:7px;font-size:11px}
.tr{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:10px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.tr:hover{background:var(--soft)}
.tr.dragging{opacity:.4}
.cb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--grey-line);background:var(--panel);flex:none;padding:0}
.cb:hover{border-color:var(--h,var(--ink))}
.cb[disabled]{opacity:.35;cursor:default;background:color-mix(in srgb,var(--h,#888) 20%,var(--panel))}
.tt{flex:1;min-width:0;color:var(--ink2);overflow-wrap:anywhere}
.tt em{font-style:italic}
.ch{flex:none;font-size:11.5px;font-weight:500;padding:2px 7px;border-radius:6px;white-space:nowrap}
.ch.bk{color:var(--h);background:color-mix(in srgb,var(--h) 15%,var(--panel))}
.ch.dl{color:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--panel))}
.ch.rt{color:var(--grey-ink);background:var(--grey-fill)}
.addrow{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--muted);padding:6px 6px;width:100%;text-align:left;border-radius:10px}
.addrow:hover{background:var(--soft)}
.addin{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:8px 10px;margin:2px 0 4px}
/* calendar */
.calhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.dayt{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.badge{min-width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:600;padding:0 6px}
.badge.off{background:var(--soft);color:var(--ink)}
.seg{display:flex;background:var(--soft);border-radius:9px;padding:3px}
.seg button{border:0;background:none;border-radius:7px;padding:4px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.navs{justify-self:end;display:flex;gap:6px}
.sq{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--ink2)}
.sq svg{width:15px;height:15px}
.txtbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:0 10px;height:30px;font-size:13px;font-weight:500}
.grid{display:grid;grid-template-columns:52px 1fr;padding:10px 12px 20px 0}
.grid.w{grid-template-columns:52px repeat(7,minmax(90px,1fr));min-width:760px}
.hours div{height:var(--hour);font-size:11.5px;color:var(--muted);text-align:right;padding-right:10px;transform:translateY(-8px)}
.hours div.cur{color:var(--red);font-weight:500}
.lane{position:relative;border-left:1px solid var(--line)}
.lane .hl{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.lane.over{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.wdh{text-align:center;padding:10px 0 8px;font-size:12px;color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--panel);z-index:4;border-bottom:1px solid var(--line)}
.wdh b{display:grid;place-items:center;margin:4px auto 0;width:28px;height:28px;border-radius:50%;font-size:14px;color:var(--ink);font-weight:600}
.wdh.td b{background:var(--red);color:#fff}
.blk{position:absolute;border-radius:10px;padding:7px 10px;overflow:hidden;line-height:1.3;font-size:12.5px}
.blk b{display:block;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.blk small{display:block;font-size:12px;opacity:.85;margin-top:3px}
.blk.tk{color:var(--h);background:color-mix(in srgb,var(--h) 15%,var(--panel));cursor:pointer;user-select:none;-webkit-user-select:none}
.blk.ev,.blk.rt{background:var(--grey-fill);border:1.5px dashed var(--grey-line);color:var(--grey-ink)}
.blk.rt{cursor:pointer}
.blk.dn{opacity:.5}
.blk.dn b{text-decoration:line-through}
.w .blk{padding:5px 7px}
.w .blk b{font-size:12px;white-space:nowrap}
.w .blk small{font-size:11px}
.rsz{position:absolute;left:0;right:0;bottom:0;height:10px;cursor:ns-resize;touch-action:none}
.rsz::after{content:"";position:absolute;left:50%;bottom:4px;width:22px;height:3px;margin-left:-11px;border-radius:2px;background:currentColor;opacity:0;transition:opacity .15s}
.blk:hover .rsz::after{opacity:.4}
.ghost{position:absolute;left:4px;right:4px;border:1.5px dashed var(--ink2);border-radius:10px;background:color-mix(in srgb,var(--ink) 5%,transparent);font-size:12px;padding:6px 9px;color:var(--ink2);pointer-events:none;z-index:5}
.now{position:absolute;left:-5px;right:0;border-top:1.5px solid var(--red);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:0;top:-5px;width:9px;height:9px;border-radius:50%;background:var(--red)}
.dlm{position:absolute;left:0;right:0;border-top:1px solid color-mix(in srgb,var(--red) 55%,transparent);z-index:2;pointer-events:none}
.dlm span{position:absolute;right:6px;top:-9px;font-size:11px;font-weight:500;color:var(--red);background:var(--panel);padding:0 5px;max-width:90%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
/* vision panel */
.vis .phead .gi{--h:#E07A12}
.vimg{flex:1;margin:0 16px;border-radius:14px;overflow:hidden;background:var(--soft);min-height:0;position:relative}
.vimg img{width:100%;height:100%;object-fit:cover;display:block}
.vcap{padding:14px 18px 18px}
.vcap h3{margin:0 0 4px;font-size:20px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.vcap p{margin:0;color:var(--muted);font-size:13.5px}
.vempty{flex:1;margin:0 16px 16px;border:1.5px dashed var(--grey-line);border-radius:14px;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
/* vision page */
.vpage{height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 30px}
.vtop{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.vtop h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em}
.vtop p{margin:4px 0 0;color:var(--muted)}
.vtop .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink2)}
.chips button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.masonry{columns:4 240px;column-gap:14px}
.tile{break-inside:avoid;margin:0 0 14px;border-radius:14px;overflow:hidden;position:relative;cursor:pointer;background:var(--soft)}
.tile img{display:block;width:100%;height:auto;transition:transform .3s}
.tile:hover img{transform:scale(1.02)}
.tile figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;color:#fff;font-size:13px;font-weight:500;background:linear-gradient(transparent,rgba(0,0,0,.55));opacity:0;transition:opacity .2s}
.tile:hover figcaption,.tile figcaption.show{opacity:1}
.dropzone{border:1.5px dashed var(--grey-line);border-radius:16px;padding:48px 20px;text-align:center;color:var(--muted)}
/* progress */
.prog .pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:1200px}
@media (max-width:980px){.prog .pgrid{grid-template-columns:1fr}}
.pcard{border:1px solid var(--line);border-radius:16px;padding:18px 20px;background:var(--panel);border-top:3px solid var(--h)}
.pcard header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.pcard h3{margin:0;font-size:16px;font-weight:600}
.pcard h4{margin:16px 0 8px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;display:flex;gap:8px;align-items:baseline}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:color-mix(in srgb,var(--h) 9%,var(--panel));border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--h);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink2)}
.pbar{height:6px;border-radius:4px;background:var(--soft);margin-top:12px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--h);border-radius:4px}
.pdots{display:flex;gap:5px;flex-wrap:wrap}
.pdots i{width:16px;height:16px;border-radius:5px;background:var(--soft);border:1px solid var(--line)}
.pdots i.y{background:var(--h);border-color:var(--h)}
.pdots i.n{background:color-mix(in srgb,var(--red) 18%,var(--panel));border-color:transparent}
.pdots i.td{outline:2px solid color-mix(in srgb,var(--h) 45%,transparent);outline-offset:1px}
.wkbars{display:flex;gap:10px;align-items:flex-end;height:74px}
.wkbars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.wkbars i{width:100%;max-width:46px;background:var(--h);border-radius:6px 6px 3px 3px;min-height:3px;opacity:.85}
.wkbars span{font-size:11.5px;color:var(--muted)}
.ms{list-style:none;margin:0;padding:0}
.ms li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.ms li:last-child{border-bottom:0}
.ms li i{width:14px;height:14px;border-radius:50%;border:2px solid var(--grey-line);flex:none}
.ms li.ok i{background:var(--h);border-color:var(--h)}
.ms li.ok span{color:var(--muted);text-decoration:line-through}
.ms li span{flex:1}
.ms li em{font-style:normal;font-size:12px;color:var(--muted)}
.ms li.late em{color:var(--red)}
.muted{color:var(--muted);font-size:12.5px;font-weight:400;margin:10px 0 0}
.mk{width:100%;border-collapse:collapse;font-size:13.5px}
.mk td{padding:6px 4px;border-bottom:1px solid var(--line)}
.mk td.r{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.mkf{display:grid;grid-template-columns:1.2fr 1.2fr .7fr .7fr auto;gap:6px;margin-top:10px}
.mkf input{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:7px 8px;min-width:0}
.mkf .btn{padding:6px 12px}
.dq{display:grid;gap:6px;margin-top:10px}
.dq div{display:flex;align-items:center;gap:6px}
.dq span{width:80px;font-size:13px;color:var(--ink2)}
.dq button,.dietq button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:12.5px}
.dq button.on{background:var(--h);color:#fff;border-color:var(--h)}
.dq button.on.no{background:var(--red);border-color:var(--red)}
.dietq{display:flex;align-items:center;gap:6px;margin:0 6px 10px;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,#E07A12 10%,var(--panel));font-size:13px}
.dietq span{flex:1;font-weight:500}
.x{border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer}
.foot{margin-top:18px}
/* focus mode */
#focus{position:fixed;inset:0;z-index:70;display:none}
#focus.open{display:block}
.fx-bg{position:absolute;inset:-40px;background:#111 center/cover no-repeat;filter:blur(28px) saturate(1.1);transform:scale(1.05)}
.fx-dim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,12,.55),rgba(10,10,12,.72))}
.fx{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:24px;text-align:center}
.fx-top{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));right:20px;display:flex;gap:8px}
.fx-top button{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;backdrop-filter:blur(6px)}
.fx-top svg{width:16px;height:16px}
.fx-phase{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.fx-task{font-size:22px;font-weight:600;letter-spacing:-.015em;margin:8px 0 26px;max-width:620px}
.fx-task em{font-style:italic}
.ring{position:relative;width:300px;height:300px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tm{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:8px;margin:22px 0 24px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.28)}
.dots i.on{background:#fff}
.fx-ctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.fx-ctl button{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:10px 20px;font-weight:600;backdrop-filter:blur(6px)}
.fx-ctl button.main{background:#fff;color:#111;border-color:#fff;min-width:130px}
.fx-pre{display:flex;gap:6px;margin-top:22px}
.fx-pre button{border:1px solid rgba(255,255,255,.22);background:none;color:rgba(255,255,255,.85);border-radius:999px;padding:5px 12px;font-size:12.5px}
.fx-pre button.on{background:rgba(255,255,255,.18);color:#fff}
.fx-snd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);max-width:92vw}
.fx-snd button{border:1px solid rgba(255,255,255,.2);background:none;color:rgba(255,255,255,.85);border-radius:999px;padding:5px 12px;font-size:12.5px}
.fx-snd button.on{background:#fff;color:#111;border-color:#fff}
.fx-snd .sep{width:1px;height:20px;background:rgba(255,255,255,.2);margin:0 4px}
.fx-snd input[type=range]{width:110px;accent-color:#fff}
.fx-snd label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:rgba(255,255,255,.8)}
.fx-snd input[type=checkbox]{accent-color:#fff}
.fx-foot{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));font-size:13px;opacity:.75}
.fx-pick{margin-bottom:22px;display:flex;flex-direction:column;gap:6px;align-items:center}
.fx-pick button{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:8px 14px;min-width:260px;text-align:left}
.fx-pick button.on{background:#fff;color:#111}
.fpill{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:65;display:none;align-items:center;gap:10px;background:var(--ink);color:var(--panel);border-radius:999px;padding:8px 14px 8px 10px;box-shadow:0 10px 28px rgba(0,0,0,.2);border:0;font-weight:600;font-variant-numeric:tabular-nums}
.fpill.show{display:flex}
.fpill i{width:10px;height:10px;border-radius:50%;background:var(--red)}
.fpill.brk i{background:#2E9E5B}
.fpill.paused i{background:var(--muted)}
/* popover, toast, flying */
.pop{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.14);padding:14px;width:260px}
.pop h6{margin:0 0 4px;font-size:14px;font-weight:600}
.pop .m{color:var(--muted);font-size:12.5px}
.pop .durs{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 12px}

</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="logo" aria-hidden="true"><i></i></div>
    <nav class="pillnav" id="nav"></nav>
    <div class="acts" id="acts"></div>
  </header>
  <main id="main"></main>
</div>
<div id="layer"></div>
<div id="focus" role="dialog" aria-label="Focus mode"></div>
<button class="fpill" id="fpill" aria-label="Open focus timer"><i></i><span id="fpillt"></span></button>
<script>
"use strict";
const START=7,END=24,TD="Todoist",PINTEREST="https://pin.it/3M7bCmDl1";
const HUES=["#E0314B","#15998F","#5856D6","#E07A12","#9B51E0","#2E9E5B","#1C8BD6","#C2417A"];
const I={
 plan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
 vision:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9.5" cy="9.5" r="1.7"/><path d="M20 15.5l-4.5-4.5L7 19.5"/></svg>',
 left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 6l-6 6 6 6"/></svg>',
 right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.5 6l6 6-6 6"/></svg>',
 refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg>',
 moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
 sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 bulb:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>',
 shuffle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h3.5c4 0 5 10 9 10H20M4 17h3.5c1.6 0 2.7-1.6 3.6-3.4M20 7h-3.5c-1.6 0-2.7 1.6-3.6 3.4M17.5 4.5L20 7l-2.5 2.5M17.5 14.5L20 17l-2.5 2.5"/></svg>',
 timer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M9.5 2.5h5"/></svg>',
 min:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 12h12"/></svg>',
 close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
 plus:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>'
};
const S={view:"plan",mode:"day",day:null,tasks:[],projects:{},inboxId:null,done:[],events:[],meta:{},blocks:{},vision:[],hist:[],diet:{},marks:[],histUntil:null,syncing:false,
  mcp:null,db:null,assets:null,status:"loading",err:null,lastSync:null,addingIn:null,vfilter:null,vshift:0,collapsed:{}};

/* helpers */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayStr=()=>ymd(new Date());
const dt=s=>new Date(s+"T00:00:00");
const addDays=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return ymd(d)};
const mondayOf=s=>{const d=dt(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
const toMin=h=>{const[a,b]=h.split(":").map(Number);return a*60+b};
const toHM=m=>pad(Math.floor(m/60))+":"+pad(m%60);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md=s=>esc(s).replace(/\*([^*]+)\*/g,"<em>$1</em>");
function st(hm){let[h,m]=hm.split(":").map(Number);const ap=h>=12&&h<24?"p":"a";h=h%12||12;return h+(m?":"+pad(m):"")+ap}
const dayName=(s,o)=>dt(s).toLocaleDateString("en-GB",o||{weekday:"short"});
const fmtDur=m=>m>=60?(Math.floor(m/60)+"h"+(m%60?" "+(m%60)+"m":"")):m+"m";
const isToday=s=>s===todayStr();
function due(t){if(!t.dueDate)return null;const[date,time]=t.dueDate.split("T");return{date,time:time?time.slice(0,5):null}}
function dlObj(t){return t.recurring?null:due(t)}
function deadline(t){const d=dlObj(t);return d?d.date:null}
function blockOf(t){return S.blocks[t.id]||null}
function durOf(t){return (S.meta[t.id]&&S.meta[t.id].minutes)||null}
function toast(msg){const el=document.createElement("div");el.className="toast";el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),3600)}
function relDay(s){const t=todayStr();if(s===t)return"";if(s===addDays(t,1))return"Tmrw ";const diff=(dt(s)-dt(t))/864e5;if(diff>0&&diff<7)return dayName(s)+" ";return dt(s).toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" "}

/* project tree + hues */
function projTree(){const ps=Object.values(S.projects),kids={};ps.forEach(p=>{const k=p.parentId&&S.projects[p.parentId]?p.parentId:"root";(kids[k]=kids[k]||[]).push(p)});
  Object.values(kids).forEach(a=>a.sort((x,y)=>(y.inboxProject?1:0)-(x.inboxProject?1:0)||(x.childOrder||0)-(y.childOrder||0)));
  const out=[];const walk=(k,d)=>(kids[k]||[]).forEach(p=>{out.push({p,depth:d});walk(p.id,d+1)});walk("root",0);return out}
const TD2HUE={berry_red:"#E0314B",red:"#E0314B",salmon:"#E0314B",magenta:"#C2417A",teal:"#15998F",mint_green:"#15998F",blue:"#1C8BD6",sky_blue:"#1C8BD6",light_blue:"#1C8BD6",grape:"#5856D6",violet:"#9B51E0",lavender:"#9B51E0",orange:"#E07A12",yellow:"#E07A12",taupe:"#E07A12",green:"#2E9E5B",lime_green:"#2E9E5B",olive_green:"#2E9E5B",charcoal:"#5B6B7F",grey:"#5B6B7F"};
function hueOf(pid){const p=S.projects[pid];if(!p||p.inboxProject)return"#5B6B7F";let root=p;while(root.parentId&&S.projects[root.parentId])root=S.projects[root.parentId];return TD2HUE[root.color]||HUES[0]}
const projOf=t=>S.projects[t.projectId]||{name:"Inbox"};

/* mcp */
function extractJSON(str){if(typeof str!=="string")return null;try{return JSON.parse(str)}catch(e){}const i=str.indexOf("{");if(i<0)return null;let dep=0,inS=false,es=false;for(let j=i;j<str.length;j++){const c=str[j];if(inS){if(es)es=false;else if(c==="\\")es=true;else if(c==='"')inS=false}else if(c==='"')inS=true;else if(c==="{")dep++;else if(c==="}"){dep--;if(dep===0){try{return JSON.parse(str.slice(i,j+1))}catch(e){return null}}}}return null}
function payload(r){if(!r)return{};const p=r.payload;if(p&&typeof p==="object")return p;if(typeof p==="string"){const j=extractJSON(p);if(j)return j}for(const b of(r.content||[]))if(b.type==="text"){const j=extractJSON(b.text);if(j)return j}return{}}
function mcpMsg(e){const c=e&&e.code;
  if(c==="needs_reauth")return"Todoist needs reconnecting. Reconnect it in claude.ai Settings, Connectors.";
  if(c==="server_not_connected"||c==="selection_required")return"Todoist isn't connected. Add it in claude.ai Settings, Connectors.";
  if(c==="not_in_manifest")return"Todoist is turned off for this page.";
  if(c==="not_granted"||c==="capability_disabled"||c==="capability_removed")return"Todoist can't be reached in this view. Open Cockpit from claude.ai.";
  if(c==="server_unavailable")return"Todoist didn't answer. Try refresh in a moment.";
  return"Todoist sync failed"+(e&&e.message?": "+e.message:".")}
async function td(tool,input){if(!S.mcp)throw{code:"not_granted"};return payload(await S.mcp.callTool(TD,tool,input,{cache:false}))}

async function loadTasks(){S.status="loading";paintStatus();
  try{const p=await td("find-projects",{limit:200});S.projects={};(p.projects||[]).forEach(x=>{if(!x.isArchived){S.projects[x.id]=x;if(x.inboxProject)S.inboxId=x.id}});
    let all=[],cur=null,g=0;do{const inp={filter:"no date | !no date",limit:100,responsibleUserFiltering:"all"};if(cur)inp.cursor=cur;const r=await td("find-tasks",inp);all=all.concat(r.tasks||[]);cur=r.hasMore?(r.nextCursor||r.cursor||null):null;g++}while(cur&&g<5);
    S.tasks=all.filter(t=>!t.checked&&!/^Cockpit test task/.test(t.content||""));
    try{const c=await td("find-completed-tasks",{since:todayStr(),until:todayStr(),limit:50});S.done=c.tasks||[]}catch(e){S.done=[]}
    S.status="ok";S.err=null;S.lastSync=Date.now()}catch(e){S.status="error";S.err=e}
  render()}
async function complete(id){const i=S.tasks.findIndex(x=>x.id===id);if(i<0)return;const t=S.tasks[i];if(t.recurring&&due(t)&&due(t).date>todayStr()){toast("Already done for today. Next one is "+(relDay(due(t).date)||"today").trim()+".");return}if(!t.recurring)S.tasks.splice(i,1);S.done.unshift(Object.assign({},t,{checked:true}));render();
  try{await td("complete-tasks",{ids:[id]});if(t.recurring)setTimeout(loadTasks,800)}catch(e){if(!t.recurring)S.tasks.splice(i,0,t);S.done.shift();render();toast(mcpMsg(e))}}
async function addTask(text,pid){text=text.trim();if(!text)return;
  try{const r=await td("add-tasks",{tasks:[{content:text,projectId:pid&&pid!==S.inboxId?pid:"inbox"}]});const nt=(r.tasks||[])[0];if(nt)S.tasks.push(nt);render()}catch(e){toast(mcpMsg(e))}}

/* blocks (Cockpit only) */
function needDb(){if(!S.db){toast("Saving isn't available in this view.");return false}return true}
async function schedule(id,date,time){const t=S.tasks.find(x=>x.id===id);if(!t)return;
  if(t.recurring){toast("Repeating tasks keep their Todoist time.");return}
  if(!needDb())return;const minutes=(blockOf(t)&&blockOf(t).minutes)||durOf(t)||30;S.blocks[id]={taskId:id,date,start:time,minutes};render();
  try{await S.db.doc("blocks/"+id).set(S.blocks[id])}catch(e){delete S.blocks[id];render();toast("Couldn't save the block.")}}
async function unschedule(id){if(!S.blocks[id]||!needDb())return;const prev=S.blocks[id];delete S.blocks[id];render();
  try{await S.db.doc("blocks/"+id).delete()}catch(e){S.blocks[id]=prev;render();toast("Couldn't remove the block.")}}
async function setDuration(id,m){S.meta[id]=Object.assign({},S.meta[id],{minutes:m});const blk=S.blocks[id]?Object.assign({},S.blocks[id],{minutes:m}):null;if(blk)S.blocks[id]=blk;render();
  if(!S.db)return;try{if(blk)await S.db.doc("blocks/"+id).set(blk);await S.db.doc("meta/"+id).set(S.meta[id])}catch(e){toast("Couldn't save the new length. Try again.")}}

/* derived */
function eventsOn(d){return S.events.filter(e=>e.date===d&&e.start&&e.end)}
function layout(items){items.sort((a,b)=>a.s-b.s||b.e-a.e);let cl=[],end=-1;const out=[];
  const flush=()=>{const lanes=[];cl.forEach(it=>{let l=lanes.findIndex(e=>e<=it.s);if(l<0){l=lanes.length;lanes.push(0)}lanes[l]=it.e;it.lane=l});cl.forEach(it=>{it.lanes=lanes.length;out.push(it)});cl=[]};
  items.forEach(it=>{if(it.s>=end&&cl.length)flush();cl.push(it);end=Math.max(end,it.e)});if(cl.length)flush();return out}
function blocksFor(d){const items=[];
  eventsOn(d).forEach(e=>items.push({kind:"ev",e,s:toMin(e.start),e2:toMin(e.end)}));
  S.tasks.forEach(t=>{const b=blockOf(t);if(b&&b.date===d){const s=toMin(b.start);items.push({kind:"tk",t,s,e2:s+(b.minutes||30)})}
    else if(t.recurring){const x=due(t);if(x&&x.date===d&&x.time){const s=toMin(x.time);items.push({kind:"rt",t,s,e2:s+(durOf(t)||30)})}}});
  if(isToday(d))S.done.forEach(t=>{const b=S.blocks[t.id];if(b&&b.date===d){const s=toMin(b.start);items.push({kind:"dn",t,s,e2:s+(b.minutes||30)})}});
  items.forEach(i=>i.e=Math.max(i.e2,i.s+22));return layout(items)}

/* ---------- render: chrome ---------- */
function renderChrome(){const th=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  $("#nav").innerHTML=`<button class="${S.view==="plan"?"on":""}" data-nav="plan">${I.plan}Plan</button><button class="${S.view==="progress"?"on":""}" data-nav="progress">${I.chart}Progress</button><button class="${S.view==="vision"?"on":""}" data-nav="vision">${I.vision}Vision</button>`;
  $("#acts").innerHTML=`<button class="round" data-act="focus" title="Focus mode" aria-label="Focus mode">${I.timer}</button><button class="round" data-act="refresh" title="Refresh from Todoist" aria-label="Refresh from Todoist">${I.refresh}</button><button class="round" data-act="theme" aria-label="Switch theme">${th==="dark"?I.sun:I.moon}</button>`}

/* ---------- tasks panel ---------- */
function statusText(){if(S.status==="loading")return`<div class="status">Syncing with Todoist</div>`;if(S.status==="error")return`<div class="status err">${esc(mcpMsg(S.err))}</div>`;return""}
function paintStatus(){const el=document.getElementById("stat");if(el)el.innerHTML=statusText()}
function taskRow(t,h){const b=blockOf(t),d=dlObj(t),r=t.recurring?due(t):null;let chip="";const future=r&&r.date>todayStr();
  if(b&&b.date>=todayStr())chip=`<span class="ch bk">${relDay(b.date)}${st(b.start)}</span>`;
  else if(r&&r.time)chip=`<span class="ch rt">${st(r.time)} daily</span>`;
  const dl=d?`<span class="ch dl" title="Deadline">${d.date<todayStr()?"Overdue":"Due "+(relDay(d.date)||"today ")+(d.time?st(d.time):"")}</span>`:"";
  return`<div class="tr" data-drag="${t.id}" style="--h:${h}"><button class="cb" ${future?`disabled title="Next due ${esc(relDay(r.date)||"today")}"`:`data-done="${t.id}"`} aria-label="Complete ${esc(t.content)}"></button><span class="tt">${md(t.content)}</span>${dl}${chip}</div>`}
const GOAL_ORDER=["Term 2 GPA","Excel Outside Class","55 kg and Healthy","Better Writer"];
const prettyLabel=l=>l.replace(/-/g," ").replace(/^./,c=>c.toUpperCase());
function goalList(){const tops=Object.values(S.projects).filter(p=>!p.parentId||!S.projects[p.parentId]);
  const rank=p=>p.inboxProject?-1:(GOAL_ORDER.indexOf(p.name)>=0?GOAL_ORDER.indexOf(p.name):(p.name==="Life Admin"?90:50+(p.childOrder||0)/1000));
  return tops.sort((a,b)=>rank(a)-rank(b))}
function subRows(ts,h,key){const lim=5,open=S.collapsed["more:"+key];const shown=open?ts:ts.slice(0,lim);
  return shown.map(t=>taskRow(t,h)).join("")+(ts.length>lim?`<button class="addrow more" data-more="${key}">${open?"Show fewer":"Show "+(ts.length-lim)+" more"}</button>`:"")}
function tasksPanel(){const goals=goalList();
  return`<section class="panel tasks"><div class="phead"><h2>Goals</h2></div><div id="stat">${statusText()}</div><div class="scroll">${S.db&&S.diet[addDays(todayStr(),-1)]===undefined?`<div class="dietq"><span>Clean diet yesterday?</span><button data-diet="${addDays(todayStr(),-1)}|1">Yes</button><button data-diet="${addDays(todayStr(),-1)}|0">No</button></div>`:""}
  ${goals.map(p=>{const ids=[p.id].concat(Object.values(S.projects).filter(x=>{let r=x;while(r.parentId&&S.projects[r.parentId]){if(r.parentId===p.id)return true;r=S.projects[r.parentId]}return false}).map(x=>x.id));
    const ts=S.tasks.filter(t=>ids.includes(t.projectId)),h=hueOf(p.id),closed=S.collapsed[p.id];
    if(p.inboxProject&&!ts.length)return"";
    const name=p.inboxProject?"Unsorted":p.name;
    const labels=[];ts.forEach(t=>(t.labels||[]).forEach(l=>{if(!labels.includes(l))labels.push(l)}));
    const bare=ts.filter(t=>!(t.labels||[]).length);
    let body="";
    if(!closed){body+=labels.map(l=>{const lt=ts.filter(t=>(t.labels||[])[0]===l);if(!lt.length)return"";return`<div class="sg" style="--h:${h}"><div class="sgh"><i></i>${esc(prettyLabel(l))}<span>${lt.length}</span></div>${subRows(lt,h,p.id+":"+l)}</div>`}).join("");
      if(bare.length)body+=`<div class="sg" style="--h:${h}">${labels.length?`<div class="sgh"><i></i>Other<span>${bare.length}</span></div>`:""}${subRows(bare,h,p.id+":_")}</div>`;
      body+=S.addingIn===p.id?`<input class="addin" id="addin" data-pid="${p.id}" placeholder="New task, press Enter">`:`<button class="addrow" data-addin="${p.id}">${I.plus}Add task</button>`}
    return`<div class="grp"><button class="gh" data-gfold="${p.id}" aria-expanded="${!closed}"><span class="gi" style="--h:${h}">${esc(name.trim().charAt(0).toUpperCase())}</span><span class="gn">${esc(name)}</span><span class="gc">${ts.length}</span><span class="gcar">${closed?"▸":"▾"}</span></button>${body}</div>`}).join("")}
  ${!Object.keys(S.projects).length&&S.status!=="loading"?`<div class="status">No projects yet.</div>`:""}</div></section>`}

/* ---------- calendar ---------- */
function laneHTML(d,compact){const H=END-START;let h="";for(let i=0;i<H;i++)h+=`<div class="hl" style="top:calc(var(--hour)*${i})"></div>`;
  blocksFor(d).forEach(b=>{if(b.s<START*60)return;const top=(b.s-START*60)/60,ht=(b.e-b.s)/60,w=100/b.lanes,l=b.lane*w;
    const pos=`top:calc(var(--hour)*${top} + 2px);height:calc(var(--hour)*${ht} - 4px);left:calc(${l}% + 4px);width:calc(${w}% - 8px)`;
    const short=(b.e-b.s)<40;
    if(b.kind==="ev")h+=`<div class="blk ev" style="${pos}"><b>${esc(b.e.title)}</b>${short?"":`<small>${st(b.e.start)} to ${st(b.e.end)}${b.e.room?", "+esc(b.e.room):""}</small>`}</div>`;
    else if(b.kind==="rt")h+=`<div class="blk rt" style="${pos}" data-blk="${b.t.id}"><b>${md(b.t.content)}</b>${short?"":`<small>${st(toHM(b.s))}</small>`}</div>`;
    else{const hue=hueOf(b.t.projectId),live=b.kind==="tk";h+=`<div class="blk tk ${live?"":"dn"}" style="${pos};--h:${hue}" ${live?`data-blk="${b.t.id}" data-drag="${b.t.id}"`:""}><b>${md(b.t.content)}</b>${short&&compact?"":`<small>${st(toHM(b.s))}${compact?"":", "+fmtDur(b.e2-b.s)}</small>`}${live?`<span class="rsz" data-rsz="${b.t.id}" title="Drag to change length"></span>`:""}</div>`}});

  if(!lane)return;const t=S.tasks.find(q=>q.id===DRAG.id),m=slotFrom(lane,y),len=(t&&((blockOf(t)&&blockOf(t).minutes)||durOf(t)))||30;DRAG.lane=lane;DRAG.slot=m;lane.classList.add("over");
  const g=document.createElement("div");g.className="ghost";g.style.top=`calc(var(--hour)*${(m-START*60)/60})`;g.style.height=`calc(var(--hour)*${len/60} - 2px)`;g.textContent=st(toHM(m))+" to "+st(toHM(Math.min(m+len,END*60-1)));lane.appendChild(g)}
function endDrag(){clearTimeout(DRAG.timer);if(DRAG.fly)DRAG.fly.remove();if(DRAG.src)DRAG.src.classList.remove("dragging");clearGhost();document.body.classList.remove("dragging-on");
  const was=DRAG.active;Object.assign(DRAG,{active:false,id:null,src:null,fly:null,timer:null,lane:null,slot:null,pid:null});if(was)DRAG.justDropped=Date.now();if(DRAG.pending){DRAG.pending=false;render()}}
document.addEventListener("pointerdown",e=>{if(e.button!==0)return;
  const h=e.target.closest("[data-rsz]");if(h){e.preventDefault();const id=h.dataset.rsz,b=S.blocks[id],el=h.closest(".blk"),lane=h.closest("[data-lane]");if(!b||!el||!lane)return;
    Object.assign(RS,{active:true,id,el,y0:e.clientY,m0:b.minutes||30,m:b.minutes||30,hp:lane.getBoundingClientRect().height/(END-START),pid:e.pointerId,start:toMin(b.start)});document.body.classList.add("resizing-on");closePop();return}
  if(e.target.closest("button,a,input,.cb"))return;const src=e.target.closest("[data-drag]");if(!src)return;
  Object.assign(DRAG,{id:src.dataset.drag,src,x0:e.clientX,y0:e.clientY,pid:e.pointerId});
  if(e.pointerType==="touch")DRAG.timer=setTimeout(()=>{if(DRAG.id&&!DRAG.active)beginDrag(DRAG.x0,DRAG.y0)},350)});
document.addEventListener("pointermove",e=>{
  if(RS.active&&e.pointerId===RS.pid){e.preventDefault();let m=RS.m0+Math.round(((e.clientY-RS.y0)/RS.hp*60)/15)*15;m=Math.max(15,Math.min(m,END*60-RS.start));RS.m=m;RS.el.style.height=`calc(var(--hour)*${m/60} - 4px)`;const sm=RS.el.querySelector("small");if(sm)sm.textContent=st(toHM(RS.start))+", "+fmtDur(m);return}
  if(!DRAG.id||e.pointerId!==DRAG.pid)return;
  if(!DRAG.active){const far=Math.hypot(e.clientX-DRAG.x0,e.clientY-DRAG.y0)>6;if(e.pointerType==="touch"){if(far){clearTimeout(DRAG.timer);DRAG.id=null}return}if(far)beginDrag(e.clientX,e.clientY);return}
  e.preventDefault();moveDrag(e.clientX,e.clientY)},{passive:false});
document.addEventListener("touchmove",e=>{if(DRAG.active||RS.active)e.preventDefault()},{passive:false});
document.addEventListener("pointerup",e=>{
  if(RS.active&&e.pointerId===RS.pid){const{id,m,m0}=RS;RS.active=false;document.body.classList.remove("resizing-on");DRAG.justDropped=Date.now();DRAG.pending=false;if(m!==m0)setDuration(id,m);else render();return}
  if(!DRAG.id||e.pointerId!==DRAG.pid)return;const id=DRAG.id,lane=DRAG.lane,slot=DRAG.slot,act=DRAG.active;endDrag();if(act&&lane&&slot!=null)schedule(id,lane.dataset.lane,toHM(slot))});
document.addEventListener("pointercancel",()=>{if(RS.active){RS.active=false;document.body.classList.remove("resizing-on");render()}if(DRAG.id)endDrag()});
window.addEventListener("blur",()=>{if(DRAG.active)endDrag()});
document.addEventListener("dragstart",e=>{if(e.target.closest&&e.target.closest("[data-drag],img"))e.preventDefault()});

/* ---------- focus mode ---------- */
const PRESETS=[[25,5,15],[50,10,20],[15,3,10]];
const CID=Math.random().toString(36).slice(2);
const F=Object.assign({taskId:null,phase:"focus",endsAt:null,left:25*60,paused:true,round:1,preset:0,open:false,count:0,date:null,running:false,sound:"rain",vol:.5,pl:"",plAuto:true,rev:0},(()=>{try{return JSON.parse(localStorage.getItem("cockpit-focus")||"{}")}catch(e){return{}}})());
if(F.date!==todayStr()){F.count=0;F.date=todayStr()}
let fsyncT=null;
const fsave=()=>{F.rev=Date.now();try{localStorage.setItem("cockpit-focus",JSON.stringify(F))}catch(e){}
  clearTimeout(fsyncT);fsyncT=setTimeout(()=>{if(!S.db)return;const d=Object.assign({},F,{by:CID});delete d.open;S.db.doc("settings/focus").set(d).catch(()=>{})},250)};
function focusFromRemote(d){if(!d||d.by===CID||(d.rev||0)<=(F.rev||0))return;const open=F.open;Object.assign(F,d);F.open=open;delete F.by;try{localStorage.setItem("cockpit-focus",JSON.stringify(F))}catch(e){}paintFocus()}
const plen=ph=>PRESETS[F.preset][ph==="focus"?0:ph==="short"?1:2]*60;
function fleft(){return F.paused?F.left:Math.max(0,Math.round((F.endsAt-Date.now())/1000))}
function currentBlockTask(){const n=new Date(),m=n.getHours()*60+n.getMinutes(),d=todayStr();const t=S.tasks.find(t=>{const b=blockOf(t);return b&&b.date===d&&toMin(b.start)<=m&&m<toMin(b.start)+(b.minutes||30)});return t?t.id:null}
function openFocus(taskId){if(!F.running){F.taskId=taskId||currentBlockTask();F.phase="focus";F.left=plen("focus");F.paused=true;F.round=1}else if(taskId&&taskId!==F.taskId&&F.phase==="focus"&&F.paused){F.taskId=taskId}
  F.open=true;fsave();paintFocus()}
function fstart(fromClick){const fresh=F.phase==="focus"&&F.left===plen("focus");if(fromClick){SND.armed=true;sctx();if(fresh&&F.pl&&F.plAuto)window.open(F.pl,"_blank","noopener")}F.running=true;F.paused=false;F.endsAt=Date.now()+F.left*1000;fsave();paintFocus()}
function fpause(){F.left=fleft();F.paused=true;fsave();paintFocus()}
function fend(){SND.armed=false;Object.assign(F,{running:false,paused:true,phase:"focus",round:1,left:plen("focus"),open:false,endsAt:null});fsave();paintFocus();document.title="Cockpit"}
function fnext(auto){if(F.phase==="focus"){if(auto){F.count++;F.date=todayStr()}F.phase=F.round%4===0?"long":"short";F.left=plen(F.phase);F.paused=false;F.endsAt=Date.now()+F.left*1000}
  else{F.phase="focus";F.round=F.round%4+1;F.left=plen("focus");F.paused=true}
  fsave();paintFocus()}
const SND={ctx:null,master:null,nodes:[],kind:null,armed:false,stopT:null,prevT:null};
function sctx(){if(!SND.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;SND.ctx=new C();SND.master=SND.ctx.createGain();SND.master.gain.value=0;SND.master.connect(SND.ctx.destination)}if(SND.ctx.state==="suspended")SND.ctx.resume();return SND.ctx}
function noiseBuf(ctx,type){const len=ctx.sampleRate*8,b=ctx.createBuffer(2,len,ctx.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let last=0,b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;if(type==="brown"){last=(last+.02*w)/1.02;d[i]=last*3.5}else{b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926}}
  const f=Math.floor(ctx.sampleRate*.5);for(let i=0;i<f;i++){const k=i/f;d[i]*=k;d[len-1-i]*=k}}return b}
function stopNodes(){SND.nodes.forEach(n=>{try{n.stop&&n.stop()}catch(e){}try{n.disconnect()}catch(e){}});SND.nodes=[];SND.kind=null}
function buildSound(kind){stopNodes();const ctx=sctx();if(!ctx||kind==="off")return;const out=[];
  if(kind==="rain"||kind==="brown"){const src=ctx.createBufferSource();src.buffer=noiseBuf(ctx,kind==="brown"?"brown":"pink");src.loop=true;
    if(kind==="rain"){const hp=ctx.createBiquadFilter();hp.type="highpass";hp.frequency.value=450;const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=6500;const g=ctx.createGain();g.gain.value=.85;
      const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=.11;lg.gain.value=.15;lfo.connect(lg);lg.connect(g.gain);lfo.start();src.connect(hp);hp.connect(lp);lp.connect(g);g.connect(SND.master);out.push(lfo,lg,hp,lp,g)}
    else{const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=850;src.connect(lp);lp.connect(SND.master);out.push(lp)}
    src.start();out.push(src)}
  else if(kind==="hum"){const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=650;lp.Q.value=.6;const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=.045;lg.gain.value=220;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
    [110,164.81,220,277.18,329.63].forEach((f,i)=>[-5,5].forEach(dtn=>{const o=ctx.createOscillator();o.type=i<2?"triangle":"sine";o.frequency.value=f;o.detune.value=dtn;const g=ctx.createGain();g.gain.value=.045;o.connect(g);g.connect(lp);o.start();out.push(o,g)}));
    lp.connect(SND.master);out.push(lp,lfo,lg)}
  SND.nodes=out;SND.kind=kind}
function fadeTo(v,sec){if(!SND.ctx)return;const g=SND.master.gain,t=SND.ctx.currentTime;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(v,t+sec)}
const wantSound=()=>SND.armed&&F.running&&!F.paused&&F.phase==="focus"&&F.sound!=="off";
function syncSound(){const w=wantSound(),key=w?F.sound+"|"+F.vol:"off";if(key===SND.key)return;SND.key=key;if(w){clearTimeout(SND.stopT);clearTimeout(SND.prevT);SND.prevT=null;if(SND.kind!==F.sound)buildSound(F.sound);fadeTo(F.vol*.7,1.5)}
  else if(SND.kind){clearTimeout(SND.prevT);SND.prevT=null;fadeTo(0,1.2);clearTimeout(SND.stopT);SND.stopT=setTimeout(()=>{if(!wantSound())stopNodes()},1400)}}
function previewSound(kind){if(kind==="off"||wantSound())return syncSound();clearTimeout(SND.prevT);clearTimeout(SND.stopT);buildSound(kind);fadeTo(F.vol*.7,.6);
  SND.prevT=setTimeout(()=>{SND.prevT=null;if(wantSound()){SND.key=null;return syncSound()}fadeTo(0,1);SND.stopT=setTimeout(()=>{if(!wantSound())stopNodes()},1100)},3500)}
function askPlaylist(){const u=prompt("Paste a Spotify or YouTube playlist link",F.pl||"");if(u===null)return;const v=u.trim();if(v&&!/^https?:\/\//i.test(v)){toast("That doesn't look like a link.");return}F.pl=v;fsave();paintFocus();if(v)toast("Playlist saved")}
function openPlaylist(){if(!F.pl)return askPlaylist();window.open(F.pl,"_blank","noopener")}
function chime(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C();[[660,0],[880,.22],[990,.44]].forEach(([f,t])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0,ctx.currentTime+t);g.gain.linearRampToValueAtTime(.18,ctx.currentTime+t+.03);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.9);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+1)})}catch(e){}}
const mmss=s=>pad(Math.floor(s/60))+":"+pad(s%60);
function focusTaskName(){const t=S.tasks.find(x=>x.id===F.taskId)||S.done.find(x=>x.id===F.taskId);return t?t.content:null}
function paintFocus(){syncSound();const el=$("#focus"),pill=$("#fpill");const left=fleft(),total=plen(F.phase),frac=total?left/total:0;
  const hue=(()=>{const t=S.tasks.find(x=>x.id===F.taskId);return F.phase!=="focus"?"#2E9E5B":t?hueOf(t.projectId):"#FFFFFF"})();
  pill.classList.toggle("show",F.running&&!F.open);pill.classList.toggle("brk",F.phase!=="focus");pill.classList.toggle("paused",F.paused);$("#fpillt").textContent=mmss(left)+(F.phase==="focus"?"":" break");
  if(F.running&&!F.paused)document.title=mmss(left)+(F.phase==="focus"?" focus":" break")+", Cockpit";else document.title="Cockpit";
  el.classList.toggle("open",F.open);if(!F.open){return}
  const v=todaysVision(),name=focusTaskName(),C=2*Math.PI*140;
  const todays=S.tasks.filter(t=>{const b=blockOf(t);return b&&b.date===todayStr()});
  if(!el.dataset.built||el.dataset.built!==[F.phase,F.paused,F.running,F.taskId,F.preset,F.round,F.count,v&&v.id,name,todays.length,F.sound,F.pl,F.plAuto].join("|")){
    el.dataset.built=[F.phase,F.paused,F.running,F.taskId,F.preset,F.round,F.count,v&&v.id,name,todays.length,F.sound,F.pl,F.plAuto].join("|");
    el.innerHTML=`<div class="fx-bg" style="${v?`background-image:url('/_blob/${esc(v.assetId)}')`:"background:linear-gradient(135deg,#2b2b33,#15151a)"}"></div><div class="fx-dim"></div>
    <div class="fx"><div class="fx-top"><button data-fx="min" title="Minimise" aria-label="Minimise">${I.min}</button><button data-fx="end" title="End focus" aria-label="End focus">${I.close}</button></div>
     <div class="fx-phase">${F.phase==="focus"?"Focus, round "+F.round+" of 4":F.phase==="short"?"Short break":"Long break"}</div>
     <div class="fx-task">${F.phase==="focus"?(name?md(name):"Just focus"):"Stand up, stretch, drink some water."}</div>
     ${!F.running&&todays.length?`<div class="fx-pick">${todays.map(t=>`<button class="${F.taskId===t.id?"on":""}" data-fxtask="${t.id}">${md(t.content)}</button>`).join("")}<button class="${F.taskId?"":"on"}" data-fxtask="">Just focus</button></div>`:""}
     <div class="ring"><svg viewBox="0 0 300 300"><circle cx="150" cy="150" r="140" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="8"/><circle id="fxarc" cx="150" cy="150" r="140" fill="none" stroke="${hue}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/></svg><div class="tm" id="fxtm">${mmss(left)}</div></div>
     <div class="dots">${[1,2,3,4].map(i=>`<i class="${i<F.round||(i===F.round&&F.phase!=="focus")?"on":""}"></i>`).join("")}</div>
     <div class="fx-ctl">${F.paused?`<button class="main" data-fx="start">${F.running?"Resume":F.phase==="focus"?"Start focus":"Start"}</button>`:`<button class="main" data-fx="pause">Pause</button>`}
      ${F.running?`<button data-fx="skip">${F.phase==="focus"?"Skip to break":"Skip break"}</button>`:""}${F.taskId&&F.phase==="focus"&&S.tasks.find(x=>x.id===F.taskId)?`<button data-fx="donetask">Mark task done</button>`:""}</div>
     ${!F.running?`<div class="fx-pre">${PRESETS.map((p,i)=>`<button class="${F.preset===i?"on":""}" data-fxpre="${i}">${p[0]} / ${p[1]}</button>`).join("")}</div>`:""}
     <div class="fx-snd">${[["off","Off"],["rain","Rain"],["brown","Brown noise"],["hum","Soft hum"]].map(([k,l])=>`<button class="${F.sound===k?"on":""}" data-fxsnd="${k}">${l}</button>`).join("")}
      <input type="range" id="fxvol" min="0" max="1" step="0.05" value="${F.vol}" aria-label="Volume"><span class="sep"></span>
      <button data-fxpl="open">${F.pl?"Open playlist":"Add playlist"}</button>${F.pl?`<label><input type="checkbox" id="fxplauto" ${F.plAuto?"checked":""}>Open with focus</label><button data-fxpl="edit" title="Change playlist link">Change</button>`:""}</div>
     <div class="fx-foot">${F.count?F.count+(F.count===1?" focus session":" focus sessions")+" today":"Space to start or pause, Esc to minimise"}</div></div>`}
  else{const tm=$("#fxtm"),arc=$("#fxarc");if(tm)tm.textContent=mmss(left);if(arc)arc.setAttribute("stroke-dashoffset",String(C*(1-frac)))}}
setInterval(()=>{if(!F.running||F.paused){return}if(fleft()<=0){chime();fnext(true);return}paintFocus()},250);
document.addEventListener("click",e=>{const b=e.target.closest("[data-fx],[data-fxpre],[data-fxtask],[data-fxsnd],[data-fxpl],#fpill");if(!b)return;
  if(b.hasAttribute("data-fxsnd")){F.sound=b.dataset.fxsnd;fsave();paintFocus();previewSound(F.sound);return}
  if(b.hasAttribute("data-fxpl")){b.dataset.fxpl==="edit"?askPlaylist():openPlaylist();return}
  if(b.id==="fpill"){F.open=true;fsave();paintFocus();return}
  if(b.hasAttribute("data-fxpre")){F.preset=+b.dataset.fxpre;F.left=plen(F.phase);fsave();paintFocus();return}
  if(b.hasAttribute("data-fxtask")){F.taskId=b.dataset.fxtask||null;fsave();paintFocus();return}
  const a=b.dataset.fx;if(a==="start")fstart(true);else if(a==="pause")fpause();else if(a==="skip")fnext(false);else if(a==="end"){if(!F.running||confirm("End this focus session?"))fend()}
  else if(a==="min"){F.open=false;fsave();paintFocus()}else if(a==="donetask"){const id=F.taskId;complete(id);F.taskId=null;fsave();paintFocus();toast("Nice. Task marked done.")}});
document.addEventListener("keydown",e=>{if(!F.open||e.target.tagName==="INPUT")return;if(e.key===" "){e.preventDefault();F.paused?fstart(true):fpause()}if(e.key==="Escape"){F.open=false;fsave();paintFocus()}});
if(F.running&&!F.paused&&fleft()<=0){fnext(true)}
paintFocus();

/* ---------- vision actions ---------- */
async function uploadVision(files){if(!S.assets||!needDb())return;const list=[...files];let ok=0;const stt=$("#vstat");
  for(const f of list){if(stt)stt.textContent=`Uploading ${ok+1} of ${list.length}`;try{const r=await S.assets.upload(f);await S.db.collection("vision").add({assetId:r.id,theme:"Unsorted",caption:"",createdAt:new Date().toISOString()});ok++}catch(e){toast("Couldn't upload "+f.name+": "+(e.message||e.code))}}
  if(stt)stt.textContent="";toast(ok+" image"+(ok===1?"":"s")+" added")}
function saveVision(id){if(!needDb())return;const c=$("#vcap"),t=$("#vthm");S.db.doc("vision/"+id).update({caption:c?c.value.trim():"",theme:(t&&t.value.trim())||"Unsorted"}).then(closePop).catch(e=>toast("Couldn't save: "+(e.message||e.code)))}
async function removeVision(id){const v=S.vision.find(x=>x.id===id);if(!v||!needDb()||!confirm("Remove this image from your board?"))return;closePop();
  try{await S.db.doc("vision/"+id).delete();if(S.assets&&v.assetId)await S.assets.delete(v.assetId).catch(()=>{})}catch(e){toast("Couldn't remove: "+(e.message||e.code))}}

/* ---------- boot ---------- */
try{const t=localStorage.getItem("cockpit-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}
S.day=todayStr();render();
setInterval(()=>{const a=document.activeElement;if(S.view==="plan"&&(!a||a.tagName!=="INPUT")&&!$("#layer").innerHTML)render()},60000);
(async()=>{const c=window.claude;if(!c||!c.use){S.status="error";S.err={code:"not_granted"};render();return}
  const[mcp,db,assets]=await Promise.all([c.use("mcp"),c.use("db"),c.use("assets")]);S.mcp=mcp;S.db=db;S.assets=assets;
  if(db){db.collection("blocks").onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.blocks=m;render()},()=>{});
    db.collection("meta").onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.meta=m;render()},()=>{});
    db.collection("events").onSnapshot(s=>{S.events=s.docs.map(d=>Object.assign({id:d.id},d.data()));render()},()=>{});
    db.collection("done").onSnapshot(s=>{S.hist=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(S.view==="progress")render()},()=>{});
    db.collection("diet").onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=!!d.data().ok);S.diet=m;render()},()=>{});
    db.collection("marks").onSnapshot(s=>{S.marks=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(S.view==="progress")render()},()=>{});
    db.doc("settings/history").onSnapshot(s=>{if(s.exists)S.histUntil=s.data().until||null},()=>{});
    db.doc("settings/focus").onSnapshot(s=>{if(s.exists)focusFromRemote(s.data())},()=>{});
    db.collection("vision").onSnapshot(s=>{S.vision=s.docs.map(d=>Object.assign({id:d.id},d.data()));render()},()=>{})}
  if(mcp)loadTasks().then(()=>setTimeout(syncHistory,1500));else{S.status="error";S.err={code:"not_granted"};render()}
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.lastSync&&Date.now()-S.lastSync>5*60000)loadTasks()})})();
</script>
